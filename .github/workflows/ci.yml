name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install CPU-only PyTorch
        run: pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          # opencv pinned <5: OpenCV 5.0 removed cv2.CascadeClassifier,
          # which src/12_live_demo.py uses for face cropping
          pip install numpy pandas matplotlib seaborn "opencv-python-headless==4.11.0.86" \
                      pillow scikit-learn kagglehub pytest

      - name: Run smoke tests
        run: pytest tests/ -v
